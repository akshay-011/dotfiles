"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 500

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$git_metrics\
$nodejs\
$rust\
$golang\
$python\
$java\
$c\
$zig\
$bun\
$deno\
$lua\
$docker_context\
$cmd_duration\
$status\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[✗](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
style = "cyan"
read_only = " 󰌾"
read_only_style = "bold red"

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "
truncation_length = 24
truncation_symbol = "…"

[git_status]
style = "bold yellow"
format = '([\[$all_status$ahead_behind\]]($style) )'
staged = "+${count} "
modified = "!${count} "
untracked = "?${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
conflicted = " ${count} "
stashed = "󰆓 "
renamed = "»${count} "
deleted = "✘${count} "
up_to_date = " "

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = "bold red"

[git_metrics]
added_style = "bold green"
deleted_style = "bold red"
only_nonzero_diffs = true
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'
disabled = false

# ------------------------------------------------------------------------------
# Language & Compiler Runtime Modules (Option B: Clean Nerd Font Glyphs)
# ------------------------------------------------------------------------------

[nodejs]
symbol = "󰎙 "
style = "bold green"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold red"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "bold yellow"
format = "[$symbol($version )]($style)"

[java]
symbol = " "
style = "bold red"
format = "[$symbol($version )]($style)"

[c]
symbol = " "
style = "bold blue"
format = "[$symbol($version )]($style)"
detect_files = ["CMakeLists.txt", "compile_flags.txt", "compile_commands.json"]

[zig]
symbol = " "
style = "bold yellow"
format = "[$symbol($version )]($style)"

[bun]
symbol = "󰮄 "
style = "bold white"
format = "[$symbol($version )]($style)"

[deno]
symbol = "🦕 "
style = "bold green"
format = "[$symbol($version )]($style)"

[lua]
symbol = " "
style = "bold blue"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = "󰡨 "
style = "bold blue"
format = "[$symbol$context]($style) "

# ------------------------------------------------------------------------------
# System & Timing
# ------------------------------------------------------------------------------

[cmd_duration]
min_time = 2000
format = "took [$duration  ]($style) "
style = "bold yellow"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘ "
style = "bold red"

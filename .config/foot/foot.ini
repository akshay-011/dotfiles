[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=19
pad=14x14 center
initial-window-mode=windowed
workers=0
box-drawings-uses-font-glyphs=no
dpi-aware=no

[scrollback]
lines=20000
multiplier=5.0
indicator-position=relative

[cursor]
style=block
blink=yes
blink-rate=500
beam-thickness=1.5
underline-thickness=1.5

[colors-dark]
alpha=0.94
background=16151a
selection-foreground=ffffff
selection-background=363d4a

[colors-light]
alpha=0.94
selection-foreground=1f2328
selection-background=d0d7de

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
style=dotted
osc8-underline=url-mode

[bell]
urgent=yes
notify=yes
command=notify-send --app-name foot --icon utilities-terminal "Foot Terminal" "Bell notification"
command-focused=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste
search-start=Control+Shift+f Control+Shift+r
show-urls-launch=Control+Shift+o
show-urls-copy=Control+Shift+y
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
spawn-terminal=Control+Shift+n

[search-bindings]
cancel=Control+g Control+c Escape
commit=Return KP_Enter
find-prev=Control+r Up
find-next=Control+s Down
cursor-left=Left Control+b
cursor-right=Right Control+f
delete-prev=BackSpace
delete-prev-word=Mod1+BackSpace Control+BackSpace

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
